# 収集元一覧。type はパーサー（collector/sources/）に対応する。
# 到達できない・構造が想定と違うものは enabled: false にし、README「収集元の状況」に記録する。
#
# 共通項目：id, name, type, url, enabled
# venue：会場名（会場HPの既定値・Geminiへのヒント）

sources:
  - id: jmesse
    name: "J-messe"
    type: jmesse
    url: "https://www.jetro.go.jp/j-messe/"
    enabled: false   # 2026-10-05 検索ページ（/j-messe/tradefair/search.html）が404

  - id: bigsight
    name: "東京ビッグサイト"
    type: venue_bigsight
    url: "https://www.bigsight.jp/visitor/event/"
    list_url: "https://www.bigsight.jp/visitor/event/search.php"
    venue: "東京ビッグサイト"
    enabled: true

  - id: makuhari
    name: "幕張メッセ"
    type: venue_makuhari
    url: "https://www.m-messe.co.jp/event/"
    venue: "幕張メッセ"
    categories: ["展示会・見本市"]   # 一覧のカテゴリで絞り込む（学会・コンサート等を除く）
    enabled: true

  - id: pacifico
    name: "パシフィコ横浜"
    type: venue_pacifico
    url: "https://www.pacifico.co.jp/"
    venue: "パシフィコ横浜"
    enabled: false   # 2026-10-05 /visitor/calendar は404。一覧はJavaScript描画（STUDIO製）

