# キーワード一次判定（C-03）
# ページのタイトル・本文に含まれる語の重みを合算し、0〜100に丸めた値を関連性スコアとする。
# スコアが settings.yaml の judge.keyword_score_threshold 以上のページだけを Gemini に送る。
# - title_multiplier：タイトルに含まれる語は重みを倍にする
# - 同じ語は何回出ても1回だけ数える
title_multiplier: 2

# 展示会・イベントであることを示す語（どれも無ければスコアを半分にする）
event_terms: ["展示会", "EXPO", "Expo", "エキスポ", "展", "フェア", "ショー", "SHOW", "Week", "WEEK", "カンファレンス", "フォーラム", "見本市", "出展", "来場", "会期"]

weights:
  # 無線・通信（最重要分野）
  "ローカル5G": 40
  "5G": 30
  "6G": 30
  "Wi-Fi": 30
  "WiFi": 30
  "無線": 30
  "LPWA": 35
  "NTN": 35
  "衛星通信": 30
  "IOWN": 30
  "通信": 20
  "ネットワーク": 15
  "ワイヤレス": 30
  "電波": 20
  # AI・DX
  "生成AI": 25
  "AI": 20
  "人工知能": 20
  "DX": 20
  "デジタルトランスフォーメーション": 20
  "クラウド": 10
  "データ活用": 10
  # IoT・センサ
  "IoT": 25
  "センサ": 15
  "エッジ": 10
  "組込み": 15
  "組込": 15
  # セキュリティ
  "情報セキュリティ": 25
  "サイバーセキュリティ": 25
  "セキュリティ": 15
  "ゼロトラスト": 20
  # ドローン・ロボット
  "ドローン": 25
  "ロボット": 20
